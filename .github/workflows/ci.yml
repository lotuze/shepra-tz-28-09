name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      JWT_TTL: 3600
      IMPORT_RATE_LIMIT: 5
      IMPORT_RATE_WINDOW_SECONDS: 60
      IMPORT_MAX_FILE_SIZE: 10485760
      IMAGE_DOWNLOAD_MAX_SIZE: 10485760
      IMAGE_DOWNLOAD_TIMEOUT: 2
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: amqp, gd, intl, mbstring, pcntl, pdo_pgsql, zip
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: composer cs-check
      - run: composer phpstan
      - run: php bin/console migrations:migrate --no-interaction
      - run: php bin/console orm:validate-schema
      - run: composer test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  openapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run openapi:validate

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:4200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare environment
        run: cp .env.example .env
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build and start Compose stack
        run: docker compose up -d --build
      - name: Wait for PostgreSQL and RabbitMQ health
        shell: bash
        run: |
          for service in db rabbitmq; do
            container_id="$(docker compose ps -q "$service")"
            for attempt in {1..60}; do
              status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
              if [ "$status" = healthy ]; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "$service did not become healthy"
                exit 1
              fi
              sleep 2
            done
          done
      - name: Apply migrations and fixtures
        run: |
          docker compose exec -T app php bin/console migrations:migrate --no-interaction
          docker compose exec -T app php bin/console fixtures:load --no-interaction
      - name: Wait for backend and Angular
        shell: bash
        run: |
          for url in http://localhost:8080/api/health http://localhost:4200; do
            for attempt in {1..60}; do
              if curl --fail --silent --show-error "$url" > /dev/null; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "$url did not become available"
                exit 1
              fi
              sleep 2
            done
          done
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser e2e
        working-directory: frontend
        run: npm run e2e
      - name: Compose diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200 app nginx worker frontend
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
