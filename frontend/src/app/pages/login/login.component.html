<mat-card class="login-card">
  <mat-card-header><mat-card-title>Вход</mat-card-title></mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="username" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <mat-error>Введите корректный email</mat-error>
        }
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Пароль</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <mat-error>Введите пароль</mat-error>
        }
      </mat-form-field>
      @if (error) { <p class="login-error" role="alert">{{ error }}</p> }
      <button mat-flat-button color="primary" type="submit" [disabled]="loading">
        @if (loading) { <mat-spinner diameter="20" /> } @else { Войти }
      </button>
    </form>
  </mat-card-content>
</mat-card>
